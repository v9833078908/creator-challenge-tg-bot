[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-hero-bot"
version = "0.1.0"
description = "Creator Hero — Telegram-бот ежедневного контент-челленджа"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.5",
]

[project.urls]
Repository = "https://github.com/v9833078908/creator-challenge-tg-bot"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.setuptools.package-data]
bot = ["data/lesson-catalog.json"]
