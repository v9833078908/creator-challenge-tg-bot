# Example vhost: set your domain, certificate paths and public HTTPS port before use.
server {
    listen 80;
    server_name lessons.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name lessons.example.com;
    ssl_certificate /etc/letsencrypt/live/lessons.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lessons.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 2m;
    location = /source/writefreely-creator-privacy1-source.tar.gz {
        alias /opt/writefreely/releases/0.17.2-creator-privacy1/source.tar.gz;
        default_type application/gzip;
        add_header Content-Disposition 'attachment; filename="writefreely-creator-privacy1-source.tar.gz"';
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
